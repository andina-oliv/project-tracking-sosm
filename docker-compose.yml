version: '3.8'

services:
  # 1. Database MySQL (otomatis menggantikan XAMPP jika dijalankan di Docker)
  db:
    image: mysql:8.0
    container_name: pt_sosm_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pt_sosm_tracking
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
    ports:
      - "3307:3306" # Port 3307 di host agar tidak bentrok bila XAMPP MySQL lokal masih aktif
    volumes:
      - pt_sosm_mysql_data:/var/lib/mysql
    networks:
      - pt_sosm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Backend Laravel 11 API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pt_sosm_backend
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: production
      APP_DEBUG: "true"
      APP_KEY: "base64:6bN8VwzO4QY2YVwzO4QY2YVwzO4QY2YVwzO4QY2YVw0="
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: pt_sosm_tracking
      DB_USERNAME: root
      DB_PASSWORD: root
    volumes:
      - ./backend:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pt_sosm_network

  # 3. Web Server Nginx (Menyajikan index.html dan proxy API)
  web:
    image: nginx:alpine
    container_name: pt_sosm_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./images.jpeg:/usr/share/nginx/html/images.jpeg:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - pt_sosm_network

volumes:
  pt_sosm_mysql_data:

networks:
  pt_sosm_network:
    driver: bridge
